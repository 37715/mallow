<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>mallow</title>
    <!-- The UI type is bundled, not a system font, so preload it: without this
         the first paint is fallback sans and the HUD visibly reflows. -->
    <link
      rel="preload"
      href="/fonts/recursive.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#8b7748" />
    <link rel="stylesheet" href="/src/ui/styles.css" />

    <!--
      The loading screen lives here, inline, and that is the whole point of it.

      Everything else the game draws is behind an 800 kB module graph, a 4 MB
      character GLB and a Draco decode — several seconds on a phone, during
      which a linked stylesheet has not necessarily applied and `main.ts` has
      certainly not run. Anything defined in those files therefore cannot be
      what the player sees first. This can, because it is in the first packet.

      It is the backdrop olive of the café, so the hand-over from the native
      launch screen to the web view to the game is one continuous colour.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #8b7748;
        /* Set before the font has loaded, so the wordmark doesn't reflow when
           Recursive arrives — it simply sharpens. */
        font-family: "Recursive", ui-rounded, system-ui, sans-serif;
        color: #f6eddd;
        transition: opacity 520ms ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      /* The mark, breathing: a saucer, the coffee, and the cat's face in the
         foam — the same drawing as the app icon (`tools/make-icons.py`), so
         the thing you tapped on the home screen is the thing that greets you.

         It was two plain circles before, which said "loading" but not *what*.
         The face is three shapes and reads at this size; it is the icon's own
         geometry, scaled. A slow pulse rather than a spinner, because a
         spinner says "waiting" and this should say "warming up". */
      #boot-cup {
        position: relative;
        width: 108px;
        height: 108px;
        border-radius: 50%;
        background: #f6eddd;
        display: grid;
        place-items: center;
        animation: boot-breathe 2.6s ease-in-out infinite;
      }
      #boot-cup::after {
        content: "";
        width: 82px;
        height: 82px;
        border-radius: 50%;
        background: #deba8f;
      }
      /* The foam cat, drawn in cream on the coffee. */
      #boot-cat {
        position: absolute;
        width: 52px;
        height: 52px;
      }

      /* Three drifting curls of steam. Staggered and slow — this is the one
         moving thing on screen, so it sets the pace of the whole launch. */
      #boot-steam {
        position: absolute;
        top: -26px;
        display: flex;
        gap: 11px;
      }
      #boot-steam i {
        display: block;
        width: 5px;
        height: 20px;
        border-radius: 999px;
        background: #f6eddd;
        opacity: 0;
        animation: boot-steam 2.8s ease-in-out infinite;
      }
      #boot-steam i:nth-child(2) {
        animation-delay: 0.55s;
      }
      #boot-steam i:nth-child(3) {
        animation-delay: 1.1s;
      }
      @keyframes boot-steam {
        0% {
          opacity: 0;
          transform: translateY(8px) scaleY(0.6);
        }
        35% {
          opacity: 0.5;
        }
        100% {
          opacity: 0;
          transform: translateY(-16px) scaleY(1.25);
        }
      }

      /* A bar that actually fills, rather than a dot that spins. Launch is a
         4 MB Draco decode on a phone and can take a few seconds; something
         that visibly advances is the difference between "loading" and
         "stuck". It is time-based rather than progress-based on purpose —
         there is no honest progress number to report, and a fake bar that
         jumps to 100% and waits is worse than one that eases toward it. */
      #boot-bar {
        width: 132px;
        height: 4px;
        border-radius: 999px;
        background: rgba(246, 237, 221, 0.22);
        overflow: hidden;
      }
      #boot-bar i {
        display: block;
        height: 100%;
        width: 100%;
        border-radius: 999px;
        background: #f6eddd;
        transform-origin: left;
        transform: scaleX(0);
        animation: boot-fill 6s cubic-bezier(0.16, 0.8, 0.3, 1) forwards;
      }
      @keyframes boot-fill {
        0% {
          transform: scaleX(0.04);
        }
        100% {
          transform: scaleX(0.94);
        }
      }
      #boot-word {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: 0.02em;
        font-variation-settings: "CASL" 1;
      }
      #boot-sub {
        margin-top: -14px;
        font-size: 12px;
        opacity: 0.72;
      }
      @keyframes boot-breathe {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.07);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-cup,
        #boot-steam i,
        #boot-bar i {
          animation: none;
        }
        #boot-bar i {
          transform: scaleX(0.5);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="ui-root"></div>
    </div>
    <div id="boot">
      <div id="boot-cup">
        <div id="boot-steam"><i></i><i></i><i></i></div>
        <!-- The cat in the foam: ears, head, and two closed eyes, matching the
             cats in the game and on the icon. -->
        <svg id="boot-cat" viewBox="0 0 48 48" aria-hidden="true">
          <path
            d="M11 20 L13 8 L21 13.5 A16 14 0 0 1 27 13.5 L35 8 L37 20
               A15 14 0 1 1 11 20 Z"
            fill="#f6eddd"
          />
          <path d="M17 25 A4 4 0 0 1 24 25" fill="none" stroke="#deba8f"
                stroke-width="2.2" stroke-linecap="round" />
          <path d="M26 25 A4 4 0 0 1 33 25" fill="none" stroke="#deba8f"
                stroke-width="2.2" stroke-linecap="round" />
        </svg>
      </div>
      <div id="boot-word">mallow</div>
      <div id="boot-sub">putting the kettle on…</div>
      <div id="boot-bar"><i></i></div>
    </div>
    <!--
      Failsafe, and it lives here rather than in main.ts on purpose.

      `dismissBootScreen` is at the end of `bootstrap()`, so anything that
      throws on the way there — a bad build, a WebGL context that won't create,
      an asset that 404s — leaves this screen up for ever. A full-screen cover
      that never lifts is a worse failure than the black screen it replaced,
      because it looks like the game is still working.

      This is an ordinary script, not a module: it runs even if the module
      graph fails to parse.
    -->
    <script>
      setTimeout(function () {
        var boot = document.getElementById("boot");
        if (!boot || boot.classList.contains("done")) return;
        boot.querySelector("#boot-sub").textContent = "something went wrong — try reopening";
        setTimeout(function () {
          boot.classList.add("done");
          setTimeout(function () {
            boot.remove();
          }, 600);
        }, 2500);
      }, 20000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
