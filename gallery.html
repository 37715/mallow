<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mallow — café asset gallery</title>
    <style>
      :root { --ink:#4a3826; --brown:#8a6a52; --cream:#f7ecd9; }
      * { box-sizing: border-box; }
      body {
        margin:0; padding:24px; background:var(--cream); color:var(--ink);
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      }
      header { position:sticky; top:0; background:var(--cream); padding-bottom:14px; z-index:2; }
      h1 { margin:0 0 4px; font-size:21px; }
      #status { font-size:13px; color:var(--brown); margin-bottom:10px; }
      #search {
        width:min(340px,100%); padding:10px 14px; font-size:15px; border-radius:12px;
        border:2px solid rgba(138,106,82,.3); background:#fffdf8; color:var(--ink); outline:none;
      }
      #search:focus { border-color:#d97b4f; }
      h2 { margin:26px 0 10px; font-size:14px; text-transform:uppercase;
           letter-spacing:.08em; color:var(--brown); }
      .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; }
      .card {
        background:#fffdf8; border-radius:14px; padding:8px; text-align:center; cursor:pointer;
        box-shadow:0 2px 8px rgba(0,0,0,.06); transition:transform .12s ease, box-shadow .12s ease;
      }
      .card:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.12); }
      .card canvas { width:100%; height:auto; display:block; border-radius:10px; }
      .name { font-size:10.5px; font-weight:700; margin-top:6px; word-break:break-all; line-height:1.3; }
      .dims { font-size:9.5px; color:var(--brown); opacity:.7; margin-top:2px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Café asset gallery</h1>
      <div id="status">Loading…</div>
      <input id="search" type="search" placeholder="Search — try 'sofa', 'cat', 'wall', 'cupcake'…" autocomplete="off" />
    </header>
    <div id="gallery"></div>
    <script type="module" src="/src/tools/gallery.ts"></script>
  </body>
</html>
